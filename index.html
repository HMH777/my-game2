<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Idle Game | Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 id="number">points: 0</h1>
    <h1 id="PPS">points per second: 1</h1>
    <hr class="splitter" />
    <div class="upgrades">
      <button class="upgrade" id="upgrade1">
        2x points gain, cost: 10 points
      </button>
      <button class="upgrade" id="upgrade2">
        +1 base on upgrade 1, cost: 50
      </button>
      <button class="upgrade" id="upgrade3"></button>
      <button class="upgrade" id="upgrade4"></button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
